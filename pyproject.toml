[project]
name = "streamtex-docs"
version = "0.7.7"
description = "StreamTeX interactive manuals and documentation"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "streamtex[ai,cli,inspector,pdf]>=0.7.7,<0.8",
    "streamtex-pack-design  @ git+https://github.com/nicolasguelfi/streamtex-packs.git@pack-design-v0.2.4#subdirectory=streamtex-pack-design",
    "streamtex-pack-manuals @ git+https://github.com/nicolasguelfi/streamtex-packs.git@pack-manuals-v0.1.0#subdirectory=streamtex-pack-manuals",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0",
    "playwright>=1.58.0",
]

[tool.uv]
default-groups = ["dev"]

# Override for local dev — points to the sibling streamtex-packs monorepo
[tool.uv.sources]
streamtex             = { path = "../streamtex",                              editable = true }
streamtex-pack-design  = { path = "../streamtex-packs/streamtex-pack-design",  editable = true }
streamtex-pack-manuals = { path = "../streamtex-packs/streamtex-pack-manuals", editable = true }

[tool.ruff.lint]
ignore = ["F403", "F405", "E701", "E741"]

[tool.ruff.lint.per-file-ignores]
# Code snippet files shown in manuals — intentionally partial (no imports)
"**/static/examples/**/*.py" = ["F821", "F811", "E501", "E402"]
# Template setup.py — intentional import-for-side-effect pattern
"templates/**/setup.py" = ["F401"]

[tool.pyright]
extraPaths = ["../streamtex"]
