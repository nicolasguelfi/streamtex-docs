# Hetzner/Coolify Auto-Deploy — Trigger Coolify deploys on push to main.
#
# Only deploys services whose files actually changed:
#   - Changes in manuals/stx_manual_intro/** → deploy streamtex-docs-intro only
#   - Changes in shared files (Dockerfile, pyproject.toml, shared-blocks/**)
#     → deploy ALL services
#   - workflow_dispatch (manual trigger) → deploy ALL services
#
# Required secret: COOLIFY_API_TOKEN (Coolify → Security → API Tokens)

name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COOLIFY_URL: https://coolify.streamtex.org

jobs:
  deploy:
    name: Trigger Coolify deploys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for streamtex version on PyPI
        run: |
          # Read the required version from .stx-version (explicit, not from uv.lock
          # which encodes a local editable path and doesn't reflect PyPI state).
          REQUIRED=$(cat .stx-version | tr -d '[:space:]')
          echo "Required version from .stx-version: $REQUIRED"

          MAX_ATTEMPTS=12
          WAIT_SECONDS=30
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            PYPI=$(curl -s https://pypi.org/pypi/streamtex/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
            echo "Attempt $attempt/$MAX_ATTEMPTS — PyPI has: $PYPI"

            # Check that PyPI version >= required (not just equal — allows newer)
            OK=$(python3 -c "
          r = tuple(int(x) for x in '$REQUIRED'.split('.'))
          p = tuple(int(x) for x in '$PYPI'.split('.'))
          print('yes' if p >= r else 'no')
          ")
            if [ "$OK" = "yes" ]; then
              echo "PyPI version $PYPI >= required $REQUIRED — proceeding"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Version too old (need >= $REQUIRED, PyPI has $PYPI). Retrying in ${WAIT_SECONDS}s..."
              sleep $WAIT_SECONDS
            fi
          done

          echo "::error::PyPI still has streamtex==$PYPI after $MAX_ATTEMPTS attempts (need >= $REQUIRED). Publish to PyPI first!"
          exit 1

      - name: Detect changed files and select services
        id: changed
        run: |
          # Service mapping: name → folder → Coolify UUID(s)
          # "replicas" lists additional container UUIDs sharing the same FQDN.
          cat > /tmp/services.json << 'SERVICES'
          {
            "streamtex-docs":           {"folder": "manuals/stx_manuals_collection", "uuid": "ts40jw5o8i1ocebd1yzx353v", "replicas": []},
            "streamtex-docs-intro":     {"folder": "manuals/stx_manual_intro",       "uuid": "e35xfitods34qlfv0rt3upc3", "replicas": []},
            "streamtex-docs-advanced":  {"folder": "manuals/stx_manual_advanced",    "uuid": "shx575v6f333to4f02cc3d0m", "replicas": []},
            "streamtex-docs-deploy":    {"folder": "manuals/stx_manual_deploy",      "uuid": "yqoe91fox1on0czhld3goa3h", "replicas": []},
            "streamtex-docs-developer": {"folder": "manuals/stx_manual_developer",   "uuid": "f8dvg08kuvuxjh1txahrwmx7", "replicas": []},
            "streamtex-docs-ai":        {"folder": "manuals/stx_manual_ai",          "uuid": "chcszbtifrb9mvzlttjzbo46", "replicas": []},
            "streamtex-docs-ce":        {"folder": "manuals/stx_manual_ce",          "uuid": "un7tvmnhh2jfk9yec56x9r7n", "replicas": []},
            "streamtex-docs-patterns":  {"folder": "manuals/stx_manual_patterns",    "uuid": "ag0u87txr5ygfr11pfqv0a1j", "replicas": []},
            "streamtex-docs-staging":   {"folder": "manuals/stx_manuals_collection", "uuid": "fvg70iwqsqkhu3bfds4dozyf", "replicas": []}
          }
          SERVICES

          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual trigger — deploying ALL services"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push — deploying ALL services"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$changed_files"

          # Shared files → deploy all
          shared_patterns="^Dockerfile$|^\.stx-version$|^pyproject.toml|^uv.lock|^shared-blocks/|^\.github/|^setup\.py|^scripts/"
          if echo "$changed_files" | grep -qE "$shared_patterns"; then
            echo "Shared files changed — deploying ALL services"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Map changed paths to service UUIDs
          echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          uuids=$(python3 -c "
          import json
          services = json.load(open('/tmp/services.json'))
          changed = '''$changed_files'''.strip().split('\n')
          to_deploy = set()
          for f in changed:
              for name, info in services.items():
                  if f.startswith(info['folder'] + '/'):
                      to_deploy.add(info['uuid'])
                      for r in info.get('replicas', []):
                          to_deploy.add(r)
          print(' '.join(sorted(to_deploy)))
          ")
          echo "UUIDs to deploy: ${uuids:-none}"
          echo "uuids=$uuids" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify deploys
        if: steps.changed.outputs.deploy_all == 'true' || steps.changed.outputs.uuids != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN secret is not set"
            exit 1
          fi

          DEPLOY_ALL="${{ steps.changed.outputs.deploy_all }}"

          if [ "$DEPLOY_ALL" = "true" ]; then
            uuids=$(python3 -c "
          import json; services=json.load(open('/tmp/services.json'))
          all_uuids = []
          for s in services.values():
              all_uuids.append(s['uuid'])
              all_uuids.extend(s.get('replicas', []))
          print(' '.join(all_uuids))
          ")
          else
            uuids="${{ steps.changed.outputs.uuids }}"
          fi

          # Deploy in batches of 4 to avoid overloading the server.
          # The cax21 (4 vCPU, 8 GB) hangs with too many concurrent Docker builds.
          BATCH_SIZE=4
          BATCH_WAIT=300  # seconds to wait between batches

          deployed=0
          failed=0
          count=0
          batch_num=1
          uuid_array=($uuids)
          total=${#uuid_array[@]}
          total_batches=$(( (total + BATCH_SIZE - 1) / BATCH_SIZE ))

          for uuid in "${uuid_array[@]}"; do
            if [ "$count" -gt 0 ] && [ $((count % BATCH_SIZE)) -eq 0 ]; then
              echo ""
              echo "Batch $batch_num/$total_batches complete — waiting ${BATCH_WAIT}s for builds to finish..."
              sleep $BATCH_WAIT
              batch_num=$((batch_num + 1))
            fi

            echo "[$((count + 1))/$total] Deploying $uuid..."
            result=$(curl -s "$COOLIFY_URL/api/v1/deploy?uuid=$uuid" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Accept: application/json")

            if echo "$result" | grep -q "deployment queued"; then
              name=$(echo "$result" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['deployments'][0]['message'])" 2>/dev/null)
              echo "  -> $name"
              deployed=$((deployed + 1))
            else
              echo "::error::Deploy failed for $uuid: $result"
              failed=$((failed + 1))
            fi
            count=$((count + 1))
          done

          echo ""
          echo "Summary: $deployed deployed, $failed failed (in $total_batches batch(es))"
          [ "$failed" -eq 0 ] || exit 1

      - name: Wait for last batch to finish building
        if: steps.changed.outputs.deploy_all == 'true' || steps.changed.outputs.uuids != ''
        run: |
          # The deploy step above QUEUES Coolify builds in batches and sleeps
          # 300 s between batches but exits as soon as the last batch is
          # queued.  The actual build of that last batch then runs on the
          # server for ~3-5 min more.  Wait long enough that every freshly
          # produced image is past its first minute (so we never prune the
          # one we just deployed) but tight enough that the cleanup step
          # doesn't double the perceived deploy duration.
          echo "Waiting 5 min for last batch builds to settle…"
          sleep 300

      - name: Post-deploy docker cleanup on Hetzner
        if: steps.changed.outputs.deploy_all == 'true' || steps.changed.outputs.uuids != ''
        env:
          HETZNER_HOST: 138.199.148.59
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          # Removes every Docker image not referenced by a running container
          # and older than 30 min, plus all unused build-cache layers.  The
          # 30-min window protects the images we just built (they are < 5
          # min old at this point) and reclaims the previous deploy's
          # images (typically hours old), so disk does not grow unbounded
          # across releases.  Server-side logic lives in
          # /usr/local/bin/docker-cleanup ('post-deploy' mode) — installed
          # out-of-band; the script is also the cron entry that runs every
          # 2 h with the more conservative threshold-based rules.
          if [ -z "$HETZNER_SSH_KEY" ]; then
            echo "::warning::HETZNER_SSH_KEY is not set — skipping cleanup. Configure it in repo secrets to enable post-deploy disk reclaim."
            exit 0
          fi

          KEY_FILE=$(mktemp)
          # ssh refuses files with broad permissions; write the key with 0600
          printf '%s\n' "$HETZNER_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          mkdir -p ~/.ssh
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i "$KEY_FILE" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "root@$HETZNER_HOST" \
              "/usr/local/bin/docker-cleanup post-deploy && tail -10 /var/log/docker-cleanup.log && echo '---' && df -h / | tail -1"

          rm -f "$KEY_FILE"

      - name: No deploy needed
        if: steps.changed.outputs.deploy_all != 'true' && steps.changed.outputs.uuids == ''
        run: echo "No services affected by this push — skipping deploy."
