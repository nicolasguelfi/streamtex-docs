# Project configuration for the reuse-architecture manual.
# This manual consumes two packs: streamtex-pack-design (universal components +
# design systems) and streamtex-pack-manuals (manual-specific overview
# components). Both live in the nicolasguelfi/streamtex-packs monorepo.

[project]
name = "stx-manual-reuse"
version = "0.2.0"

[[packs]]
type = "git"
name = "streamtex-pack-design"
ref = "github.com/nicolasguelfi/streamtex-packs#streamtex-pack-design"
rev = "pack-design-v0.2.4"

[[packs]]
type = "git"
name = "streamtex-pack-manuals"
ref = "github.com/nicolasguelfi/streamtex-packs#streamtex-pack-manuals"
rev = "pack-manuals-v0.1.0"

[design_system]
use = "default"

[resolution]
prefer = ["streamtex-pack-design", "streamtex-pack-manuals"]
