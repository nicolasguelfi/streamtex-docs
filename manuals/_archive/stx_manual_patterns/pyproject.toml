[project]
name = "stx-manual-patterns"
version = "0.1.0"
description = "StreamTeX Patterns Manual — the pattern catalog mechanism"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "streamtex[ai,cli,inspector,pdf]>=0.3.0",
]

[tool.uv.sources]
streamtex = { path = "../../../streamtex", editable = true }

[tool.ruff.lint]
ignore = ["F403", "F405", "E701", "E741"]
