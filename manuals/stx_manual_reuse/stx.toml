# Project configuration for the reuse-architecture manual.
# This manual is itself a streamtex 0.7.x consumer of the streamtex-design
# pack — it imports and renders the 18 components for live demonstration.

[project]
name = "stx-manual-reuse"
version = "0.2.0"

[[packs]]
type = "git"
name = "streamtex-design"
ref = "github.com/nicolasguelfi/streamtex-design"
rev = "v0.1.0"

[design_system]
use = "default"

[resolution]
prefer = ["streamtex-design"]
