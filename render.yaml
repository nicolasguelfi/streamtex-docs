    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FOLDER
        value: manuals/stx_manual_advanced
      - key: STX_PASSWORD
        value: ""
    healthCheckPath: /_stcore/health

  - type: web
    name: streamtex-deploy
    runtime: docker
    repo: https://github.com/nicolasguelfi/streamtex-docs
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FOLDER
        value: manuals/stx_manual_deploy
      - key: STX_PASSWORD
        value: ""
    healthCheckPath: /_stcore/health

  - type: web
    name: streamtex-developer
    runtime: docker
    repo: https://github.com/nicolasguelfi/streamtex-docs
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FOLDER
        value: manuals/stx_manual_developer
      - key: STX_PASSWORD
        value: ""
    healthCheckPath: /_stcore/health

  - type: web
