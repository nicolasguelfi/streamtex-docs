services:
  - type: web
    name: streamtex
    runtime: docker
    repo: https://github.com/nicolasguelfi/streamtex-docs
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FOLDER
        value: manuals/stx_manuals_collection
      - key: STX_URL_TEST_INTRO
        value: https://docs-intro.streamtex.org
      - key: STX_URL_TEST_ADVANCED
        value: https://docs-advanced.streamtex.org
      - key: STX_URL_TEST_DEPLOY
        value: https://docs-deploy.streamtex.org
      - key: STX_URL_TEST_DEVELOPER
        value: https://docs-developer.streamtex.org
      - key: STX_URL_TEST_AI
        value: https://docs-ai.streamtex.org
      - key: STX_PASSWORD
        value: ""
    healthCheckPath: /_stcore/health

  - type: web
    name: streamtex-intro
    runtime: docker
    repo: https://github.com/nicolasguelfi/streamtex-docs
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FOLDER
        value: manuals/stx_manual_intro
      - key: STX_PASSWORD
        value: ""
    healthCheckPath: /_stcore/health

  - type: web
    name: streamtex-advanced
