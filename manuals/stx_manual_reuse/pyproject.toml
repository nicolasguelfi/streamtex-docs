[project]
name = "stx-manual-reuse"
version = "0.2.0"
description = "StreamTeX Reuse Architecture Manual — packs, components, design systems, kits (streamtex 0.7.x). Self-demonstrating: imports and renders every component of streamtex-design."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "streamtex[ai,cli,inspector,pdf]>=0.7.0",
    "streamtex-design @ git+https://github.com/nicolasguelfi/streamtex-design.git@v0.1.0",
]

[tool.uv.sources]
streamtex = { path = "../../../streamtex", editable = true }
streamtex-design = { path = "../../../streamtex-design", editable = true }

[tool.ruff.lint]
ignore = ["F403", "F405", "E701", "E741"]
